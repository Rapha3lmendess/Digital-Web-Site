<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- ==================================================
         CONFIGURAÇÕES DA PÁGINA
    =================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" type="image/x-icon" href="../imagens/favicon.ico">

    <title>Download | Digital Ghost</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


    <!-- ==================================================
         MENU PRINCIPAL
    =================================================== -->

    <header class="navbar">

        <!-- Logo -->
        <a href="../index.html" class="logo">
            DIGITAL <span>GHOST</span>
        </a>


        <!-- Menu -->
        <nav>

            <a href="../index.html">
                Início
            </a>

            <a href="tales.html">
                Yokai Tales
            </a>

            <a href="download.html" class="active">
                Download
            </a>

            <a href="perfil.html">
                Perfil
            </a>

            <a href="cadastro.html">
                Cadastro
            </a>

            <a href="login.html" class="btn-login">
                Login
            </a>

        </nav>

    </header>



    <!-- ==================================================
         CONTEÚDO PRINCIPAL
    =================================================== -->

    <main>

        <section class="game-hero">

            <div class="download-container">


                <!-- ==================================================
                     TÍTULO E DESCRIÇÃO
                =================================================== -->

                <div class="download-heading">

                    <h1>
                        DOWNLOAD <span>YOKAI TALES</span>
                    </h1>

                    <p>
                        Baixe o jogo e embarque nessa aventura.
                    </p>

                </div>



                <!-- ==================================================
                     CONTEÚDO DO DOWNLOAD
                =================================================== -->

                <div class="download-content-wrapper">


                    <!-- ==================================================
                         CARD DO JOGO
                    =================================================== -->

                    <div class="download-card">

                        <h2>
                            YOKAI TALES
                        </h2>


                        <div class="download-details">

                            <p>
                                <strong>Versão:</strong> 1.0
                            </p>

                            <p>
                                <strong>Plataforma:</strong> Windows
                            </p>

                        </div>


                        <!-- Botão de download -->
                        <button
                            type="button"
                            id="downloadButton"
                            class="download-button"
                        >
                            BAIXAR JOGO
                        </button>

                    </div>



                    <!-- ==================================================
                         IMAGEM DO JOGO
                    =================================================== -->

                    <div class="download-image">

                        <img
                            src="../imagens/yokaidowloadfoto.png"
                            alt="Capa do jogo Yokai Tales"
                        >

                    </div>


                </div>

            </div>

        </section>



        <!-- ==================================================
             MODAL DE LOGIN
        =================================================== -->

        <div
            id="downloadModal"
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="downloadModalTitle"
            hidden
        >

            <div class="modal-content">

                <!-- Fechar -->
                <button
                    type="button"
                    id="closeDownloadModal"
                    class="modal-close"
                    aria-label="Fechar janela"
                >
                    &times;
                </button>


                <p class="orange-text">
                    DOWNLOAD
                </p>


                <h2 id="downloadModalTitle">
                    CONFIRME SEU LOGIN
                </h2>


                <p>
                    Entre na sua conta para continuar o download.
                </p>


                <form id="formDownloadLogin">

                    <!-- E-mail -->
                    <label for="downloadLoginEmail">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="downloadLoginEmail"
                        placeholder="Digite seu e-mail"
                        required
                    >


                    <!-- Senha -->
                    <label for="downloadLoginSenha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="downloadLoginSenha"
                        placeholder="Digite sua senha"
                        required
                    >


                    <!-- Confirmar -->
                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        CONFIRMAR E BAIXAR
                    </button>


                    <!-- Mensagem -->
                    <p
                        id="mensagemDownload"
                        aria-live="polite"
                    ></p>

                </form>

            </div>

        </div>

    </main>
    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script
        type="module"
        src="../js/script.js"
    ></script>


</body>

</html>
