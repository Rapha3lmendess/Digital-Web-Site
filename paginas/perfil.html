<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- ==================================================
         CONFIGURAÇÕES DA PÁGINA
    =================================================== -->

    <!-- Define a codificação dos caracteres -->
    <meta charset="UTF-8">

    <!-- Faz o site funcionar corretamente em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Ícone que aparece na aba do navegador -->
    <link rel="shortcut icon" type="image/x-icon" href="../imagens/favicon.ico">

    <!-- Título que aparece na aba do navegador -->
    <title>Perfil | Digital Ghost</title>

    <!-- Arquivo CSS principal -->
    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


    <!-- ==================================================
         MENU PRINCIPAL
    =================================================== -->

    <header class="navbar">


        <!-- Logo da empresa -->

        <a href="../index.html" class="logo">
            DIGITAL <span>GHOST</span>
        </a>


        <!-- Links de navegação -->

        <nav>


            <!-- Volta para a página inicial -->

            <a href="../index.html">
                Início
            </a>


            <!-- Página do jogo -->

            <a href="tales.html">
                Yokai Tales
            </a>


            <!-- Página atual: Perfil -->

            <a href="perfil.html" class="active">
                Perfil
            </a>


            <!-- Página de cadastro -->

            <a href="cadastro.html">
                Cadastro
            </a>


            <!-- Página de login -->

            <a href="login.html" class="btn-login">
                Login
            </a>

        </nav>

    </header>



    <!-- ==================================================
         PERFIL
    =================================================== -->

    <main class="profile-page">

        <section class="profile-card">


            <!-- ==================================================
                 FOTO DO PERFIL
            ================================================== -->

            <div class="profile-avatar">

                <!--
                    Imagem utilizada como avatar.

                    Como o perfil está dentro da pasta "paginas",
                    usamos ../ para acessar outras pastas.
                -->

                <img
                    src="https://i.pinimg.com/736x/3c/b4/14/3cb4148f22f10714f1d5ed7e6d807205.jpg"
                    alt="Foto de perfil do jogador"
                >

            </div>



            <!-- ==================================================
                 TÍTULO DO PERFIL
            ================================================== -->

            <p class="orange-text">
                PERFIL DO USUÁRIO
            </p>


            <h1>
                JOGADOR
            </h1>


            <p>
                Bem-vindo ao seu perfil da Digital Ghost Software.
            </p>



            <!-- ==================================================
                 INFORMAÇÕES DO USUÁRIO
            ================================================== -->

            <div class="profile-info">


                <!-- Nome -->

                <div>

                    <strong>
                        NOME
                    </strong>

                    <span>
                        Usuário
                    </span>

                </div>



                <!-- E-mail -->

                <div>

                    <strong>
                        E-MAIL
                    </strong>

                    <span>
                        usuario@email.com
                    </span>

                </div>



                <!-- Jogo favorito -->

                <div>

                    <strong>
                        JOGO FAVORITO
                    </strong>

                    <span>
                        Yokai Tales
                    </span>

                </div>


            </div>



            <!-- ==================================================
                 BOTÕES DO PERFIL
            =================================================== -->

            <div class="profile-buttons">


                <!-- Ir para a página do jogo -->

                <a href="tales.html" class="btn-primary">
                    YOKAI TALES
                </a>


                <!-- Voltar para a página inicial -->

                <a href="../index.html" class="btn-secondary">
                    INÍCIO
                </a>


            </div>

        </section>

    </main>



    <!-- ==================================================
         RODAPÉ
    =================================================== -->

    <footer>


        <!-- Nome da empresa -->

        <h3>
            DIGITAL <span>GHOST</span>
        </h3>


        <!-- Informação sobre o projeto -->

        <p>
            Projeto acadêmico desenvolvido para fins educacionais.
        </p>


    </footer>



    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <!--
        O JavaScript está na pasta "js".

        Como esta página está dentro de "paginas",
        usamos ../ para voltar à pasta principal.
    -->

    <script type="module" src="../js/script.js"></script>


</body>

</html>
